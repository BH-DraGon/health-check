<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTC Health Hub — ระบบบันทึกสุขภาพออนไลน์</title>
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #8B0000;
            --primary-soft: #fff1f1;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --sidebar-width: 260px;
            --bg: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #1e293b; overflow-x: hidden; }

        /* Animation */
        .view { display: none; min-height: 100vh; animation: fadeIn 0.4s ease-out; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Student Form Layout */
        #view-form { align-items: center; justify-content: center; background: radial-gradient(circle at top right, #fff5f5, #f3f4f6); padding: 20px; }
        #view-form.active { display: flex; }
        .form-card { background: white; border-radius: 24px; padding: 35px; width: 100%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 1px solid #fff; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: var(--secondary); margin-bottom: 6px; font-weight: 500; }
        .input-group input, .input-group select { 
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1.5px solid #e2e8f0; 
            outline: none; font-family: 'Kanit'; font-size: 14px; transition: all 0.2s; 
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

        .btn-submit { 
            width: 100%; padding: 16px; background: var(--primary); color: white; border: none; 
            border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; 
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        .btn-submit:hover { background: #600000; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,0,0,0.2); }

        /* Admin Dashboard Layout */
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: #1e293b; color: white; padding: 35px 25px; position: fixed; height: 100vh; z-index: 10; }
        .sidebar h3 { font-size: 22px; margin-bottom: 5px; color: #fff; letter-spacing: 1px; }
        .sidebar-nav { margin-top: 40px; }
        .nav-btn { 
            width: 100%; padding: 12px; background: rgba(255,255,255,0.05); color: #94a3b8; 
            border: none; border-radius: 10px; cursor: pointer; text-align: left; 
            display: flex; align-items: center; gap: 12px; transition: 0.2s; margin-bottom: 10px;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 40px; }
        
        /* Filter Bar */
        .filter-section {
            background: white; padding: 20px; border-radius: 20px; margin-bottom: 25px;
            display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; border: 1px solid #edf2f7; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .stat-card p { font-size: 13px; color: var(--secondary); margin-bottom: 5px; }
        .stat-card h2 { font-size: 32px; font-weight: 600; }

        .table-wrap { background: white; border-radius: 20px; border: 1px solid #edf2f7; overflow: hidden; box-shadow: 0 10px 15px rgba(0,0,0,0.03); }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 18px 25px; text-align: left; font-size: 13px; color: var(--secondary); background: #f8fafc; font-weight: 500; border-bottom: 1px solid #f1f5f9; }
        td { padding: 18px 25px; border-top: 1px solid #f1f5f9; font-size: 14px; }
        
        .bmi-tag { padding: 5px 12px; border-radius: 8px; font-weight: 600; font-family: 'Space Mono'; font-size: 12px; }
        .btn-del { 
            color: var(--danger); background: #fff1f2; border: none; width: 38px; height: 38px; 
            border-radius: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn-del:hover { background: var(--danger); color: white; }

        @media (max-width: 768px) {
            .sidebar { width: 70px; padding: 20px 10px; }
            .sidebar h3, .sidebar p, .nav-btn span { display: none; }
            .main-content { margin-left: 70px; padding: 20px; }
            .filter-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- [1] หน้าฟอร์มบันทึกข้อมูล (สำหรับนักศึกษา) -->
    <div id="view-form" class="view active">
        <div class="form-card">
            <div style="text-align:center; margin-bottom:25px;">
                <i class="fas fa-heart-pulse" style="font-size:45px; color:var(--primary);"></i>
                <h2 style="margin-top:12px;">HTC Health Hub</h2>
                <p style="font-size:13px; color:var(--secondary); margin-top:5px;">วิทยาลัยเทคนิคหาดใหญ่</p>
            </div>
            
            <form id="healthForm">
                <div class="input-group">
                    <label>รหัสนักศึกษา (11 หลัก)</label>
                    <input type="text" id="sid" maxlength="11" placeholder="683010xxxxx" required>
                </div>
                <div class="input-group">
                    <label>ชื่อ-นามสกุล</label>
                    <input type="text" id="fullname" placeholder="กรอกชื่อและนามสกุล" required>
                </div>

                <div class="input-group">
                    <label>แผนกวิชา</label>
                    <select id="department" required>
                        <option value="">เลือกแผนกวิชา...</option>
                        <option value="ช่างยนต์">ช่างยนต์</option>
                        <option value="ช่างกลโรงงาน">ช่างกลโรงงาน</option>
                        <option value="ช่างเชื่อมโลหะ">ช่างเชื่อมโลหะ</option>
                        <option value="ช่างไฟฟ้ากำลัง">ช่างไฟฟ้ากำลัง</option>
                        <option value="ช่างอิเล็กทรอนิกส์">ช่างอิเล็กทรอนิกส์</option>
                        <option value="ช่างก่อสร้าง">ช่างก่อสร้าง</option>
                        <option value="สถาปัตยกรรม">สถาปัตยกรรม</option>
                        <option value="ช่างสำรวจ">ช่างสำรวจ</option>
                        <option value="เทคนิคการผลิต">เทคนิคการผลิต</option>
                        <option value="เทคโนโลยีคอมพิวเตอร์">เทคโนโลยีคอมพิวเตอร์</option>
                        <option value="เทคโนโลยีธุรกิจดิจิทัล">เทคโนโลยีธุรกิจดิจิทัล (คอมฯ ธุรกิจ)</option>
                        <option value="การบัญชี">การบัญชี</option>
                        <option value="การตลาด">การตลาด</option>
                        <option value="เทคโนโลยีสารสนเทศ">เทคโนโลยีสารสนเทศ</option>
                    </select>
                </div>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div class="input-group">
                        <label>ระดับชั้น</label>
                        <select id="level" required>
                            <option value="">เลือกระดับ...</option>
                            <option value="ปวช. 1">ปวช. 1</option>
                            <option value="ปวช. 2">ปวช. 2</option>
                            <option value="ปวช. 3">ปวช. 3</option>
                            <option value="ปวส. 1">ปวส. 1</option>
                            <option value="ปวส. 2">ปวส. 2</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>ห้อง</label>
                        <select id="room" required>
                            <option value="">เลือกห้อง...</option>
                            <option value="1">ห้อง 1</option>
                            <option value="2">ห้อง 2</option>
                            <option value="3">ห้อง 3</option>
                            <option value="4">ห้อง 4</option>
                            <option value="5">ห้อง 5</option>
                        </select>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div class="input-group">
                        <label>น้ำหนัก (kg)</label>
                        <input type="number" id="weight" step="0.1" placeholder="0.0" required>
                    </div>
                    <div class="input-group">
                        <label>ส่วนสูง (cm)</label>
                        <input type="number" id="height" step="0.1" placeholder="0" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> บันทึกข้อมูลสุขภาพ
                </button>
            </form>
            
            <div style="text-align:center; margin-top:25px;">
                <button onclick="showPage('view-admin')" style="background:none; border:none; color:var(--secondary); font-size:12px; cursor:pointer; text-decoration:underline;">
                    เข้าสู่ระบบ Dashboard แอดมิน
                </button>
            </div>
        </div>
    </div>

    <!-- [2] หน้า Admin Dashboard -->
    <div id="view-admin" class="view">
        <div class="admin-layout">
            <aside class="sidebar">
                <h3>HTC ADMIN</h3>
                <p style="font-size:11px; color:#64748b; margin-bottom:20px;">Health Tracker v2.0</p>
                <div class="sidebar-nav">
                    <button class="nav-btn" onclick="showPage('view-form')">
                        <i class="fas fa-arrow-left"></i> <span>กลับหน้าฟอร์ม</span>
                    </button>
                </div>
            </aside>

            <main class="main-content">
                <header style="margin-bottom:30px;">
                    <h1 style="font-weight:600;">Dashboard สรุปข้อมูลสุขภาพ</h1>
                </header>

                <div class="stats-grid">
                    <div class="stat-card"><p>ทั้งหมด</p><h2 id="st-total">0</h2></div>
                    <div class="stat-card"><p style="color:var(--success)">สุขภาพปกติ</p><h2 id="st-normal">0</h2></div>
                    <div class="stat-card"><p style="color:var(--danger)">เสี่ยง/อ้วน</p><h2 id="st-risk">0</h2></div>
                </div>

                <!-- ระบบการกรอง (Filters) -->
                <div class="filter-section">
                    <input type="text" id="filterSearch" placeholder="🔍 ค้นหาชื่อ หรือ รหัส..." oninput="renderTable()">
                    <select id="filterDept" onchange="renderTable()">
                        <option value="">ทุกแผนกวิชา</option>
                        <option value="ช่างยนต์">ช่างยนต์</option>
                        <option value="ช่างกลโรงงาน">ช่างกลโรงงาน</option>
                        <option value="ช่างไฟฟ้ากำลัง">ช่างไฟฟ้ากำลัง</option>
                        <option value="ช่างอิเล็กทรอนิกส์">ช่างอิเล็กทรอนิกส์</option>
                        <option value="เทคโนโลยีคอมพิวเตอร์">เทคโนโลยีคอมพิวเตอร์</option>
                        <option value="เทคโนโลยีสารสนเทศ">เทคโนโลยีสารสนเทศ</option>
                        <option value="การบัญชี">การบัญชี</option>
                    </select>
                    <select id="filterStatus" onchange="renderTable()">
                        <option value="">ทุกสถานะ</option>
                        <option value="ปกติ">ปกติ</option>
                        <option value="ท้วม">ท้วม</option>
                        <option value="อ้วน">อ้วน</option>
                        <option value="น้ำหนักน้อย">น้ำหนักน้อย</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>รหัส</th>
                                <th>ชื่อ-นามสกุล</th>
                                <th>แผนก/ระดับ/ห้อง</th>
                                <th>BMI</th>
                                <th>สถานะ</th>
                                <th style="text-align:center;">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="realtimeTable"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCiJAZhh9hzvvuWDwr4A6sj9m4XPvMyZrM",
            authDomain: "health-tracker-htc.firebaseapp.com",
            databaseURL: "https://health-tracker-htc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "health-tracker-htc",
            storageBucket: "health-tracker-htc.appspot.com",
            messagingSenderId: "58674059419",
            appId: "1:58674059419:web:d0f038fbde0c691a2d49be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allRecords = []; // เก็บข้อมูลทั้งหมดไว้สำหรับ Filter

        // --- 2. ฟังก์ชันคำนวณ BMI & สถานะ ---
        function getBMIStatus(bmi) {
            const b = parseFloat(bmi);
            if(b >= 30) return { text: "อ้วนมาก", color: "#ef4444" };
            if(b >= 25) return { text: "อ้วน", color: "#f87171" };
            if(b >= 23) return { text: "ท้วม", color: "#f59e0b" };
            if(b >= 18.5) return { text: "ปกติ", color: "#10b981" };
            return { text: "น้ำหนักน้อย", color: "#3b82f6" };
        }

        // --- 3. จัดการหน้าจอ ---
        function showPage(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- 4. บันทึกข้อมูล ---
        document.getElementById('healthForm').onsubmit = (e) => {
            e.preventDefault();
            const w = parseFloat(document.getElementById('weight').value);
            const h = parseFloat(document.getElementById('height').value) / 100;
            const bmi = (w / (h * h)).toFixed(1);

            const data = {
                sid: document.getElementById('sid').value,
                name: document.getElementById('fullname').value,
                department: document.getElementById('department').value,
                level: document.getElementById('level').value,
                room: document.getElementById('room').value,
                bmi: bmi,
                timestamp: Date.now()
            };

            db.ref('health_records').push(data).then(() => {
                alert("บันทึกสำเร็จ!");
                e.target.reset();
            });
        };

        // --- 5. ดึงข้อมูล Real-time ---
        db.ref('health_records').on('value', (snapshot) => {
            const data = snapshot.val();
            allRecords = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    allRecords.push({ id: key, ...data[key] });
                });
            }
            allRecords.sort((a, b) => b.timestamp - a.timestamp);
            updateStats();
            renderTable();
        });

        // --- 6. อัปเดตสถิติ (คำนวณจากยอดรวมทั้งหมด) ---
        function updateStats() {
            let stats = { total: allRecords.length, normal: 0, risk: 0 };
            allRecords.forEach(r => {
                if (parseFloat(r.bmi) >= 23) stats.risk++; 
                else stats.normal++;
            });
            document.getElementById('st-total').innerText = stats.total;
            document.getElementById('st-normal').innerText = stats.normal;
            document.getElementById('st-risk').innerText = stats.risk;
        }

        // --- 7. วาดตารางข้อมูล (พร้อมระบบกรอง) ---
        function renderTable() {
            const search = document.getElementById('filterSearch').value.toLowerCase();
            const dept = document.getElementById('filterDept').value;
            const status = document.getElementById('filterStatus').value;
            const tbody = document.getElementById('realtimeTable');
            
            tbody.innerHTML = '';

            const filteredData = allRecords.filter(r => {
                const currentStatus = getBMIStatus(r.bmi).text;
                const matchSearch = r.name.toLowerCase().includes(search) || r.sid.includes(search);
                const matchDept = dept === "" || r.department === dept;
                const matchStatus = status === "" || currentStatus === status;
                return matchSearch && matchDept && matchStatus;
            });

            filteredData.forEach(r => {
                const statusInfo = getBMIStatus(r.bmi);
                tbody.innerHTML += `
                    <tr>
                        <td style="font-family:'Space Mono'">${r.sid}</td>
                        <td><b>${r.name}</b></td>
                        <td>${r.department}<br><small style="color:gray">${r.level} / ห้อง ${r.room}</small></td>
                        <td style="font-family:'Space Mono'; font-weight:700">${r.bmi}</td>
                        <td><span class="bmi-tag" style="background:${statusInfo.color}20; color:${statusInfo.color}">${statusInfo.text}</span></td>
                        <td style="text-align:center;">
                            <button class="btn-del" onclick="deleteEntry('${r.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function deleteEntry(key) {
            if(confirm('ลบข้อมูลนี้หรือไม่?')) db.ref('health_records/' + key).remove();
        }
    </script>
</body>
</html>
