<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTC Health Hub — Online Real-time</title>
    
    <!-- Firebase SDK (v8 for compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #8B0000;
            --primary-soft: #fff1f1;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --sidebar-width: 260px;
            --bg: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #1e293b; overflow-x: hidden; }

        .view { display: none; min-height: 100vh; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Form Card */
        #view-form { align-items: center; justify-content: center; background: radial-gradient(circle at top right, #fff5f5, #f3f4f6); padding: 20px; }
        #view-form.active { display: flex; }
        .form-card { background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: var(--secondary); margin-bottom: 5px; font-weight: 500; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #e2e8f0; outline: none; font-family: 'Kanit'; font-size: 14px; transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

        .btn-submit { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit:hover { background: #600000; transform: translateY(-2px); }

        /* Admin Dashboard */
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: #1e293b; color: white; padding: 30px 20px; position: fixed; height: 100vh; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 20px; border: 1px solid #edf2f7; display: flex; align-items: center; gap: 15px; }
        
        .table-wrap { background: white; border-radius: 20px; border: 1px solid #edf2f7; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 18px 25px; text-align: left; font-size: 13px; color: var(--secondary); background: #f8fafc; }
        td { padding: 18px 25px; border-top: 1px solid #f1f5f9; font-size: 14px; }
        
        .bmi-tag { padding: 5px 12px; border-radius: 8px; font-weight: 600; font-family: 'Space Mono'; font-size: 12px; }
        .btn-del { color: var(--danger); background: #fff1f2; border: none; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- [1] หน้าฟอร์มสำหรับนักศึกษา -->
    <div id="view-form" class="view active">
        <div class="form-card">
            <div style="text-align:center; margin-bottom:30px;">
                <i class="fas fa-heart-pulse" style="font-size:40px; color:var(--primary);"></i>
                <h2 style="margin-top:10px;">HTC Health Hub</h2>
                <p style="font-size:12px; color:var(--secondary);">บันทึกข้อมูลสุขภาพระบบออนไลน์</p>
            </div>
            <form id="healthForm">
                <div class="input-group"><label>รหัสนักศึกษา</label><input type="text" id="sid" required></div>
                <div class="input-group"><label>ชื่อ-นามสกุล</label><input type="text" id="fullname" required></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="input-group">
                        <label>ระดับชั้น</label>
                        <select id="level" required>
                            <option value="ปวช. 1">ปวช. 1</option><option value="ปวช. 2">ปวช. 2</option><option value="ปวช. 3">ปวช. 3</option>
                            <option value="ปวส. 1">ปวส. 1</option><option value="ปวส. 2">ปวส. 2</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>ห้อง (1-8)</label>
                        <select id="room" required>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option>
                        </select>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="input-group"><label>น้ำหนัก (kg)</label><input type="number" id="weight" step="0.1" required></div>
                    <div class="input-group"><label>ส่วนสูง (cm)</label><input type="number" id="height" step="0.1" required></div>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> ส่งข้อมูล Real-time</button>
            </form>
            <div style="text-align:center; margin-top:20px;">
                <button onclick="showPage('view-admin')" style="background:none; border:none; color:var(--secondary); font-size:12px; cursor:pointer; text-decoration:underline;">แอดมินดู Dashboard</button>
            </div>
        </div>
    </div>

    <!-- [2] หน้า Admin Dashboard -->
    <div id="view-admin" class="view">
        <div class="admin-layout">
            <div class="sidebar">
                <h3>HTC ADMIN</h3>
                <p style="font-size:11px; color:#94a3b8;">Firebase Real-time Mode</p>
                <nav style="margin-top:30px;">
                    <button onclick="showPage('view-form')" style="width:100%; padding:12px; border-radius:10px; border:none; cursor:pointer; background:rgba(255,255,255,0.1); color:white;">หน้าแรก</button>
                </nav>
            </div>
            <div class="main-content">
                <div class="stats-grid">
                    <div class="stat-card"><div><p style="font-size:12px;">ทั้งหมด</p><h2 id="st-total">0</h2></div></div>
                    <div class="stat-card"><div><p style="font-size:12px; color:var(--success)">ปกติ</p><h2 id="st-normal">0</h2></div></div>
                    <div class="stat-card"><div><p style="font-size:12px; color:var(--danger)">เสี่ยง/อ้วน</p><h2 id="st-risk">0</h2></div></div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>ชื่อ-นามสกุล</th><th>ระดับ/ห้อง</th><th>BMI</th><th>สถานะ</th><th>ลบ</th></tr></thead>
                        <tbody id="realtimeTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === ดึงข้อมูลจาก image_a114bc.png ===
        const firebaseConfig = {
            apiKey: "AIzaSyCiJAZhh9hzvvuWDwr4A6sj9m4XPvMyZrM",
            authDomain: "health-tracker-htc.firebaseapp.com",
            databaseURL: "https://health-tracker-htc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "health-tracker-htc",
            storageBucket: "health-tracker-htc.appspot.com",
            messagingSenderId: "58674059419",
            appId: "1:58674059419:web:d0f038fbde0c691a2d49be",
            measurementId: "G-S3BRLCTKM0"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // เสียงแจ้งเตือน
        const playSound = () => {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start(); osc.stop(ctx.currentTime + 0.5);
        };

        // ส่งข้อมูล
        document.getElementById('healthForm').onsubmit = (e) => {
            e.preventDefault();
            const w = parseFloat(document.getElementById('weight').value);
            const h = parseFloat(document.getElementById('height').value) / 100;
            const bmi = (w / (h * h)).toFixed(1);

            const data = {
                sid: document.getElementById('sid').value,
                name: document.getElementById('fullname').value,
                level: document.getElementById('level').value,
                room: document.getElementById('room').value,
                bmi: bmi,
                time: Date.now()
            };

            db.ref('records').push(data).then(() => {
                playSound();
                alert("ส่งข้อมูลสำเร็จ!");
                e.target.reset();
            });
        };

        // ดึงข้อมูล Real-time (Auto Update)
        db.ref('records').on('value', (snap) => {
            const items = snap.val();
            const tbody = document.getElementById('realtimeTable');
            tbody.innerHTML = '';
            let stats = { total: 0, normal: 0, risk: 0 };

            if(items) {
                Object.keys(items).reverse().forEach(key => {
                    const s = items[key];
                    stats.total++;
                    let status = "ปกติ", color = "#10b981";
                    if(s.bmi >= 23) { status = "เสี่ยง/อ้วน"; color = "#ef4444"; stats.risk++; }
                    else { stats.normal++; }

                    tbody.innerHTML += `
                        <tr>
                            <td><b>${s.name}</b></td>
                            <td>${s.level} / ${s.room}</td>
                            <td style="font-family:'Space Mono'">${s.bmi}</td>
                            <td><span class="bmi-tag" style="background:${color}20; color:${color}">${status}</span></td>
                            <td><button class="btn-del" onclick="deleteData('${key}')"><i class="fas fa-trash"></i></button></td>
                        </tr>`;
                });
            }
            document.getElementById('st-total').innerText = stats.total;
            document.getElementById('st-normal').innerText = stats.normal;
            document.getElementById('st-risk').innerText = stats.risk;
        });

        function deleteData(key) {
            if(confirm('ลบข้อมูลนี้?')) db.ref('records/' + key).remove();
        }

        function showPage(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
